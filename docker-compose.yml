services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fornecedores_queiroz_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fornecedores_queiroz_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  migrator:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    profiles:
      - production
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    # Roda as migrations e em seguida popula os CSVs e o usuário 4827
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    networks:
      - internal

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    profiles:
      - production
    depends_on:
      migrator:
        condition: service_completed_successfully
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    profiles:
      - production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3333}:80"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
